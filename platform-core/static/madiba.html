<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><title>G.O.D.S · MADIBA</title>
<style>body{margin:0;background:#060E1C;color:#8fa0bd;font:14px system-ui;padding:24px}</style></head>
<body><p id="m">Loading MADIBA operator…</p>
<script>
(async function(){
  const base="https://raw.githubusercontent.com/Surge4life/CapstoneProjectSJS/main/platform-core/static/";
  try{
    const chunks=[];
    for(let i=0;i<3;i++){
      const r=await fetch(base+"madiba_payload_"+i+".b64?v=20260807m",{cache:"no-store"});
      if(!r.ok) throw new Error("part "+i);
      chunks.push((await r.text()).trim());
    }
    const bin=Uint8Array.from(atob(chunks.join("")),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("m").innerHTML="MADIBA payload missing · <a style=color:#C9A84C href=/divisions>Divisions</a> · "+e.message;
  }
})();
</script></body></html>
