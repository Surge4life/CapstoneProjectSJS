<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UDOC · Sentinel · restoring…</title>
<style>
body{margin:0;font:14px system-ui;background:#060E1C;color:#F1F5F9;padding:24px}
.muted{color:#94A3B8} a{color:#00C2D4}
</style>
</head><body>
<p>Loading Sentinel from last-good commit…</p>
<p class="muted">If this hangs, open <a href="/eif-ui">/eif-ui</a> or hard-refresh after deploy.</p>
<script>
(async function () {
  var GOOD =
    "https://raw.githubusercontent.com/Surge4life/CapstoneProjectSJS/cdfb7e1d/platform-core/static/sentinel.html";
  try {
    var r = await fetch(GOOD + "?t=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    var html = await r.text();
    if (html.length < 1000 || /SEE_FILE|PLACEHOLDER/.test(html)) {
      throw new Error("bad restore payload length=" + html.length);
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML =
      "<h1>Sentinel restore failed</h1><pre>" +
      String(e.message || e) +
      "</pre><p><a href='/eif-ui'>EIF UI</a> · <a href='/health'>health</a></p>";
  }
})();
</script>
</body></html>
