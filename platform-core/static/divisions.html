<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>G.O.D.S · Divisions · Pre-seed</title>
<!-- preseed-gzip-embed-2026-08-06 -->
<style>body{margin:0;background:#060E1C;color:#8fa0bd;font:14px system-ui;padding:24px}#m{max-width:40rem}</style>
</head>
<body>
<p id="m">Booting pre-seed divisions UI…</p>
<script>
(async function(){
  const B64 = "PLACEHOLDER_B64";
  try {
    const bin = Uint8Array.from(atob(B64), c => c.charCodeAt(0));
    let html;
    if (typeof DecompressionStream !== "undefined") {
      const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
      html = await new Response(stream).text();
    } else {
      throw new Error("DecompressionStream not supported");
    }
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById("m").innerHTML =
      "Could not inflate densified UI ("+e.message+"). " +
      "Fallback: <a style=color:#00C2D4 href=\"/gbs\">/gbs</a>";
  }
})();
</script>
</body>
</html>
