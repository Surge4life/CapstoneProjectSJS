<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>G.O.D.S · Divisions · Production</title>
<!-- prod-4part-2026-08-06-ops -->
<style>body{margin:0;background:#050b16;color:#8fa0bd;font:14px system-ui;padding:24px}</style>
</head>
<body>
<p id="m">Booting production divisions UI…</p>
<script>
(async function(){
  const base="https://raw.githubusercontent.com/Surge4life/CapstoneProjectSJS/main/platform-core/static/";
  let b64=null;
  try {
    const chunks=[];
    for (let i=0;i<4;i++){
      const r=await fetch(base+"divisions_payload_"+i+".b64",{cache:"no-store"});
      if(!r.ok) throw new Error("part "+i+" HTTP "+r.status);
      chunks.push((await r.text()).trim());
    }
    b64=chunks.join("");
    if(b64.length<500||b64.includes("PLACEHOLDER")) throw new Error("bad payload");
  } catch(e){
    document.getElementById("m").innerHTML="Payload missing · <a style=color:#00C2D4 href=/gbs>/gbs</a> · "+e.message;
    return;
  }
  try{
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){ document.getElementById("m").textContent="Inflate failed: "+e.message; }
})();
</script>
</body>
</html>
