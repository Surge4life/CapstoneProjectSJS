# Reference GRUB2 entry for the UDOC sovereign node (UEFI, signed kernel).
menuentry "UDOC Sovereign Node (live-status)" {
    set gfxpayload=keep
    linux  /boot/vmlinuz-udoc root=LABEL=UDOC_ROOT ro \
           systemd.unit=live-status.target \
           udoc.node_class=governance-worker udoc.sovereign=1 \
           module.sig_enforce=1 lockdown=confidentiality
    initrd /boot/initrd-udoc.img
}
