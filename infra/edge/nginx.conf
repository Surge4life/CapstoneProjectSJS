# UDOC external edge — the ONLY public boundary into the governance network.
# Deny-by-default: only external-safe paths are proxied to platform-core (internal bind).
# Internal consoles + admin/oversight/sovereignty/audit are NEVER exposed here.

events { worker_connections 1024; }
http {
  # platform-core on the internal interface (not publicly routable)
  upstream gods_core { server 10.0.0.10:8000; }

  # basic rate limiting for the public edge
  limit_req_zone $binary_remote_addr zone=edge:10m rate=20r/s;

  server {
    listen 443 ssl http2;
    server_name gods-edge.example;          # your sovereign edge hostname
    # ssl_certificate / ssl_certificate_key configured by ops (TLS 1.3, hybrid PQC per spec)

    # default: DENY everything not explicitly allowed below
    location / { return 403; }

    # ── external-safe allow-list (the only paths outside parties can reach) ──
    location = /health            { proxy_pass http://gods_core; }
    location /auth/               { limit_req zone=edge burst=10; proxy_pass http://gods_core; }
    location /portal/             { limit_req zone=edge burst=20; proxy_pass http://gods_core; }
    location /saas/               { limit_req zone=edge burst=20; proxy_pass http://gods_core; }
    location /madiba/engage/      { limit_req zone=edge burst=20; proxy_pass http://gods_core; }
    location /ts/submit/          { limit_req zone=edge burst=20; proxy_pass http://gods_core; }
    location /documents/          { client_max_body_size 25m; proxy_pass http://gods_core; }

    # ── explicitly blocked (internal-only; belt-and-braces even though default denies) ──
    location /admin/        { return 403; }
    location /oversight/    { return 403; }
    location /sovereignty/  { return 403; }
    location /audit/        { return 403; }
    location /analytics/    { return 403; }
    location /intelligence/ { return 403; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
