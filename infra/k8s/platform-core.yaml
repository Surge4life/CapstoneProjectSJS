apiVersion: apps/v1
kind: Deployment
metadata: { name: platform-core, labels: { app: platform-core, division: UDOC } }
spec:
  replicas: 2
  selector: { matchLabels: { app: platform-core } }
  template:
    metadata: { labels: { app: platform-core } }
    spec:
      containers:
        - name: platform-core
          image: gods/platform-core:1.0.0
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health/ready, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10 }
          env: [{ name: GODS_ENVIRONMENT, value: sovereign }]
---
apiVersion: v1
kind: Service
metadata: { name: platform-core }
spec:
  selector: { app: platform-core }
  ports: [{ port: 80, targetPort: 8000 }]
