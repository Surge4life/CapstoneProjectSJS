# Render Blueprint — G.O.D.S / UDOC stack
# Capstone live env: free Render (~20 active services max) + Neon (~500MB).
# Do NOT add parallel services for demo screens — fold into existing hosts.
# DATABASE_URL = external Neon (manual). Preserve GODS_SOV_KEY.
#
# Service map (intentional):
#   gods-platform-core     = API + Neon
#   gods-udoc-admin        = GODS UDOC Admin mainframe (udoc-internal)
#   gods-udoc-client       = Client console + Citizen Portal page (udoc-public)
#   gods-udoc-gateway      = Sign-on / routing
#   gods-udoc-operator     = Operator workspace
#   gods-udoc-sector       = Sector PUBLIC/PRIVATE
#   gods-udoc-web          = PWA / mobile OTA surface (udoc-app)
#   gods-platform-internal = staff React internal
#   gods-portals           = division portals-web

services:
  - type: web
    name: gods-platform-core
    runtime: python
    rootDir: platform-core
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GODS_SOV_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: gods-udoc-web
    runtime: static
    rootDir: udoc-app
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-platform-internal
    runtime: static
    rootDir: platform-internal
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-portals
    runtime: static
    rootDir: portals-web
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-udoc-admin
    runtime: static
    rootDir: udoc-internal
    branch: main
    autoDeploy: true
    buildCommand: "echo static-no-build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-udoc-client
    runtime: static
    rootDir: udoc-public
    branch: main
    autoDeploy: true
    buildCommand: "echo static-no-build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /citizen
        destination: /citizen.html
      - type: rewrite
        source: /citizen/
        destination: /citizen.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-udoc-operator
    runtime: static
    rootDir: udoc-operator
    branch: main
    autoDeploy: true
    buildCommand: "echo static-no-build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-udoc-gateway
    runtime: static
    rootDir: udoc-gateway
    branch: main
    autoDeploy: true
    buildCommand: "echo static-no-build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-udoc-sector
    runtime: static
    rootDir: udoc-sector
    branch: main
    autoDeploy: true
    buildCommand: "echo static-no-build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
