        destination: /index.html

  # ---- GODS Admin UDOC — internal sovereign operations mainframe ----
  - type: web
    name: gods-udoc-admin
    runtime: static
    rootDir: udoc-internal
    branch: main
    autoDeploy: true
    buildCommand: "echo static-no-build"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
