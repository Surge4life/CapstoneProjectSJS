# Render blueprint for the G.O.D.S / UDOC eco-system.
# Connect this GitHub repo to Render (New > Blueprint). Pushes to `main` auto-deploy both services.
services:
  # ---- UDOC governance API (FastAPI) ----
  - type: web
    name: gods-platform-core
    runtime: python
    rootDir: platform-core
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python seed.py
    # --proxy-headers trusts X-Forwarded-Proto from Render's TLS terminator for HTTPS enforcement.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: GODS_ENVIRONMENT
        value: production
      - key: GODS_JWT_SECRET       # auth signing key; Render generates + stores it
        generateValue: true
      - key: GODS_SOV_KEY          # sovereign signing key
        generateValue: true
      # RENDER_GIT_COMMIT / RENDER_GIT_BRANCH / RENDER_RELEASE_CREATED_AT injected by Render
      # and surfaced at GET /version so the mobile app can detect new deploys.

  # ---- UDOC web app / PWA (the mobile WebView points here for instant OTA) ----
  - type: web
    name: gods-udoc-web
    runtime: static
    rootDir: udoc-app
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
