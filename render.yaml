# Render Blueprint — the ENTIRE G.O.D.S / UDOC stack as code.
# Connect this repo in Render (New > Blueprint). Pushes to `main` auto-deploy.
#
# ⚠ FREE POSTGRES EXPIRES ~30 DAYS AFTER CREATION — Render DELETES it. See DB_EXPIRY_RUNBOOK.md.
#   DATABASE_URL is external Neon (set manually). Preserve GODS_SOV_KEY across redeploys.

# databases:                      # gods-db REMOVED — DATABASE_URL points at EXTERNAL Neon.
#   - name: gods-db
#     plan: free
#     region: oregon
#     postgresMajorVersion: "18"

services:
  # ---- UDOC governance API (FastAPI) — the core ----
  - type: web
    name: gods-platform-core
    runtime: python
    rootDir: platform-core
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GODS_SOV_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

  # ---- UDOC web app / PWA ----
  - type: web
    name: gods-udoc-web
    runtime: static
    rootDir: udoc-app
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ---- Internal staff console (React/Vite static) ----
  - type: web
    name: gods-platform-internal
    runtime: static
    rootDir: platform-internal
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
