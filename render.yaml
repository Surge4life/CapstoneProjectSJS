# Render Blueprint — G.O.D.S / UDOC stack
# DATABASE_URL = external Neon (manual). Preserve GODS_SOV_KEY.

services:
  - type: web
    name: gods-platform-core
    runtime: python
    rootDir: platform-core
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GODS_SOV_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: gods-udoc-web
    runtime: static
    rootDir: udoc-app
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: gods-platform-internal
    runtime: static
