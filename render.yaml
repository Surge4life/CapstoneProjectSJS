# G.O.D.S Ecosystem — Render Blueprint (infrastructure-as-code).
# One-click deploy of the backend + a managed Postgres + the internal console (static).
# In the Render dashboard: New → Blueprint → connect this repo → Apply.
#
# NOTE (free tier): web services sleep after 15 min idle (slow first hit); free Postgres
# expires after 30 days. Upgrade those two to paid before a real launch.

databases:
  - name: gods-db
    databaseName: gods
    plan: free            # upgrade to 'basic-256mb' or higher before the 30-day expiry

services:
  # ── Backend: FastAPI platform-core (the always-on core all apps connect to) ──
  - type: web
    name: gods-platform-core
    runtime: python
    plan: free            # upgrade to 'starter' to remove the 15-min sleep
    rootDir: platform-core
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gods-db
          property: connectionString
      - key: GODS_ENVIRONMENT
        value: production
      - key: GODS_JWT_SECRET
        generateValue: true       # Render generates a strong secret; never hardcode
      - key: PYTHON_VERSION
        value: "3.12.4"

  # ── Internal staff console (network-locked in prod; here as a static site for demo) ──
  - type: web
    name: gods-platform-internal
    runtime: static
    rootDir: platform-internal
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://gods-platform-core.onrender.com   # full backend URL (https + host)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── External portals PWA (the installable Student/Employer/Employee app) ──
  - type: web
    name: gods-portals
    runtime: static
    rootDir: portals-web
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://gods-platform-core.onrender.com   # default backend (connect screen can override)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

