<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="M.A.D.I.B.A Capital — Capital &amp; Sovereign Partnerships">
  <title>M.A.D.I.B.A Capital — Capital &amp; Sovereign Partnerships</title>
  <defs>
    <linearGradient id="madG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C97A"/><stop offset="1" stop-color="#D4A017"/></linearGradient>
    <radialGradient id="madCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4A017" stop-opacity="0.26"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="54" cy="55" r="41" fill="url(#madCore)"/>
  <g transform="translate(3.5,6) scale(0.50)">
    <path d="M90 38 Q110 36 118 50 Q130 48 135 58 Q142 65 138 80 Q145 88 140 100 Q145 115 138 128 Q132 145 120 155 Q108 165 100 165 Q88 165 80 155 Q68 145 65 128 Q58 112 65 98 Q62 85 68 72 Q72 58 80 48 Z"
          fill="#D4A017" fill-opacity="0.10" stroke="url(#madG)" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- capital-node network: the engine within the continent -->
  <line x1="54" y1="52" x2="63" y2="40" stroke="url(#madG)" stroke-width="1.4" opacity="0.55"/>
  <line x1="54" y1="52" x2="47" y2="68" stroke="url(#madG)" stroke-width="1.4" opacity="0.55"/>
  <circle cx="63" cy="40" r="3" fill="url(#madG)" opacity="0.85"/>
  <circle cx="47" cy="68" r="3" fill="url(#madG)" opacity="0.85"/>
  <circle cx="54" cy="52" r="6" fill="url(#madG)"/>
  <circle cx="54" cy="52" r="2.6" fill="#060E1C"/>
  <!-- outward capital flows: from Africa, not into it -->
  <g stroke="url(#madG)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M82 44 L97 35"/><path d="M91 34 L98 35 L96 42"/>
    <path d="M84 59 L99 59"/><path d="M93 54 L100 59 L93 64"/>
  </g>
</svg>