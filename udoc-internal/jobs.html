<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>UDOC Admin · Scheduled Jobs</title>
<style>
:root{--navy:#0A1628;--navy2:#0D1F3C;--gold:#C9A84C;--gold-l:#E8C97A;--cyan:#00C2D4;--txt:#EDE7D6;--mut:#8A9BB0;--green:#10B981;--bd:rgba(201,168,76,.2);--fm:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--txt);font-family:system-ui,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--navy2)}
header b{color:var(--gold-l)}a{color:var(--cyan);text-decoration:none}
main{padding:20px 24px;max-width:1000px;margin:0 auto}
.panel{background:var(--navy2);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-top:14px}
.panel h3{margin:0 0 10px;color:var(--gold)}
.btn{cursor:pointer;border:1px solid var(--gold);background:rgba(201,168,76,.12);color:var(--gold-l);border-radius:8px;padding:10px 14px;font-weight:600;margin-right:8px}
.btn.cyan{border-color:var(--cyan);color:var(--cyan);background:rgba(0,194,212,.1)}
pre{white-space:pre-wrap;background:#091022;border-radius:8px;padding:12px;font-family:var(--fm);font-size:11.5px;color:var(--mut)}
.job{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.job .t{font-weight:600}.job .d{font-size:12px;color:var(--mut);margin-top:4px}
</style>
</head>
<body>
<header>
  <b>G.O.D.S · UDOC ADMIN</b>
  <span style="color:var(--mut)">Scheduled Jobs · demo parity</span>
  <span style="flex:1"></span>
  <a href="/">← Mainframe</a>
  <a href="/api-health.html">API Health</a>
</header>
<main>
  <div class="panel">
    <h3>Job runners (live Core)</h3>
    <div class="job"><div><div class="t">Compliance sweep</div><div class="d">POST /compliance/sweep</div></div><button class="btn cyan" type="button" onclick="run('/compliance/sweep','POST')">Run</button></div>
    <div class="job"><div><div class="t">Bias scan</div><div class="d">GET /bias/scan</div></div><button class="btn cyan" type="button" onclick="run('/bias/scan','GET')">Run</button></div>
    <div class="job"><div><div class="t">Conformance scan (if provisioned)</div><div class="d">POST /conformance/scan</div></div><button class="btn cyan" type="button" onclick="run('/conformance/scan','POST')">Run</button></div>
    <div class="job"><div><div class="t">Regulator summary</div><div class="d">GET /udoc/regulator/summary</div></div><button class="btn cyan" type="button" onclick="run('/udoc/regulator/summary','GET')">Run</button></div>
  </div>
  <div class="panel"><h3>Last result</h3><pre id="out">Idle — run a job.</pre></div>
</main>
<script>
const API=localStorage.getItem('gods_admin_api')||'https://gods-platform-core.onrender.com';
const tok=()=>localStorage.getItem('gods_admin_tok')||'';
async function run(path, method){
  const out=document.getElementById('out');
  out.textContent='Running '+method+' '+path+'…';
  try{
    const h={'Content-Type':'application/json'}; if(tok()) h.Authorization='Bearer '+tok();
    const r=await fetch(API+path,{method,headers:h,body:method==='POST'?'{}':undefined});
    const ct=r.headers.get('content-type')||'';
    const body=ct.includes('json')?await r.json().catch(()=>({})):await r.text();
    out.textContent=method+' '+path+' → HTTP '+r.status+'\n'+JSON.stringify(body,null,2).slice(0,4000);
  }catch(e){ out.textContent='Error: '+e.message; }
}
</script>
</body>
</html>
