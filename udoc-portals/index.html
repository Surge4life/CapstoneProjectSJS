<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDOC · Sovereign-Operator Portals</title>
<style>
:root{--navy:#0A1628;--navy2:#0D1F3C;--navy3:#112A52;--line:rgba(201,168,76,.16);--gold:#C9A84C;--gold-l:#E8C97A;
--cyan:#00C2D4;--green:#10B981;--amber:#F59E0B;--red:#EF5350;--ink:#EAF0F8;--mut:#8FA3BE;--mut2:#5E7290}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px}
.serif{font-family:Georgia,serif}button{font-family:inherit;cursor:pointer;border:0}
a{color:var(--gold-l)}
/* login */
#login{max-width:380px;margin:9vh auto;padding:0 22px;text-align:center}
#login svg{width:84px;height:84px;margin-bottom:14px}
#login h1{font-size:30px;letter-spacing:5px;color:var(--gold-l);margin:0 0 4px}
#login .sub{color:var(--mut);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:26px}
.in{width:100%;background:var(--navy2);border:1px solid var(--line);border-radius:11px;padding:13px 14px;color:var(--ink);font-size:15px;margin-bottom:11px}
.in:focus{outline:none;border-color:var(--gold)}
.btn{background:var(--gold);color:#1a1305;border-radius:11px;padding:13px 18px;font-weight:700;font-size:14px;width:100%}
.btn:active{background:var(--gold-l)}.btn.sm{width:auto;padding:9px 15px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold-l);font-weight:600}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
/* app */
#app{display:none}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:13px;padding:14px 22px;
  background:rgba(10,22,40,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top svg{width:30px;height:30px}.top .ttl{font-size:17px;font-weight:700;flex:1}.top .ttl b{color:var(--gold-l);font-weight:700}
.top .who{font-size:12px;color:var(--mut);text-align:right;line-height:1.3}
.wrap{max-width:1180px;margin:0 auto;padding:22px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.bar .stat{color:var(--mut);font-size:13px}
.group{margin:26px 0 10px;display:flex;align-items:center;gap:12px}
.group h2{margin:0;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.group .ln{flex:1;height:1px;background:var(--line)}.group .ct{color:var(--mut2);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:13px}
.pc{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer;transition:transform .08s,border-color .15s}
.pc:hover{transform:translateY(-2px);border-color:rgba(201,168,76,.45)}
.pc .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc .nm{font-size:16px;font-weight:700;line-height:1.25}
.pc .dv{font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:3px 7px;border-radius:6px;white-space:nowrap}
.dv.GODS{background:rgba(201,168,76,.16);color:var(--gold-l)} .dv.UDOC{background:rgba(0,194,212,.14);color:#6fe4f0}
.dv.SETHS{background:rgba(16,185,129,.14);color:#5ee9bf} .dv.MADIBA{background:rgba(245,158,11,.14);color:#fbc36a}
.pc .role{font-size:12px;color:var(--mut);margin-top:9px;text-transform:capitalize}
.pc .caps{margin-top:11px;font-size:11.5px;color:var(--mut2)}
.pc .enter{margin-top:12px;color:var(--gold-l);font-size:12px;font-weight:600}
/* drawer */
.dw-bg{position:fixed;inset:0;background:rgba(2,7,15,.6);z-index:40;display:none}
.dw-bg.on{display:block}
.dw{position:fixed;top:0;right:0;height:100%;width:min(440px,94vw);background:var(--navy2);border-left:1px solid var(--line);
  z-index:50;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:20px 22px 40px}
.dw.on{transform:none}
.dw .x{position:absolute;top:16px;right:18px;color:var(--mut);font-size:22px;background:none}
.dw .grp{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700}
.dw h3{margin:6px 0 3px;font-size:24px}
.dw .meta{color:var(--mut);font-size:13px;text-transform:capitalize}
.lbl{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);margin:20px 0 9px}
.chip{display:inline-block;font-size:11.5px;color:var(--gold-l);background:rgba(201,168,76,.1);border:1px solid var(--line);border-radius:8px;padding:5px 10px;margin:0 5px 6px 0}
.ctrl{display:block;width:100%;text-align:left;background:var(--navy);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;margin-bottom:9px;color:var(--ink);font-size:14px;display:flex;align-items:center;justify-content:space-between}
.ctrl:hover{border-color:rgba(201,168,76,.4)}.ctrl .a{color:var(--gold-l);font-size:18px}
.note{font-size:12.5px;color:var(--mut2);background:var(--navy);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;line-height:1.5}
.tile{background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:12px;display:inline-block;width:calc(50% - 5px);margin:0 9px 9px 0;vertical-align:top}
.tile:nth-child(2n){margin-right:0}.tile .v{font-size:21px;font-weight:700;color:var(--gold-l)}.tile .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin-top:5px}
.pill{font-size:10px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px}
.pill.ok{background:rgba(16,185,129,.16);color:#5ee9bf}.pill.warn{background:rgba(245,158,11,.16);color:#fbc36a}
.live{display:inline-block;font-size:10px;color:var(--green);border:1px solid rgba(16,185,129,.4);border-radius:20px;padding:2px 9px;vertical-align:middle;margin-left:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0a1c34;border:1px solid var(--gold);color:var(--gold-l);padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:90}
.field label{display:block;font-size:11px;text-transform:uppercase;color:var(--mut);margin:11px 0 5px;letter-spacing:.4px}
</style></head>
<body>

<div id="login">
  <svg viewBox="0 0 108 108"><circle cx="54" cy="54" r="30" fill="none" stroke="#C9A84C" stroke-width="3.4"/>
    <circle cx="54" cy="50" r="10" fill="#C9A84C"/><path d="M49 57 L45.5 75 L62.5 75 L59 57 Z" fill="#C9A84C"/></svg>
  <h1 class="serif">UDOC</h1><div class="sub">Sovereign-Operator Portals</div>
  <input class="in" id="li-email" placeholder="email" autocomplete="username">
  <input class="in" id="li-pass" type="password" placeholder="password" autocomplete="current-password">
  <button class="btn" id="li-btn" onclick="login()">Sign in</button>
  <div class="err" id="li-err"></div>
  <details style="margin-top:16px;color:var(--mut2);font-size:12px"><summary>API endpoint</summary>
    <input class="in" id="li-api" style="margin-top:8px" placeholder="https://gods-platform-core.onrender.com"></details>
</div>

<div id="app">
  <div class="top">
    <svg viewBox="0 0 108 108"><circle cx="54" cy="54" r="30" fill="none" stroke="#C9A84C" stroke-width="4"/>
      <circle cx="54" cy="50" r="10.5" fill="#C9A84C"/><path d="M49 57 L45 75 L63 75 L59 57 Z" fill="#C9A84C"/></svg>
    <div class="ttl serif"><b>UDOC</b> · Sovereign-Operator Portals</div>
    <div class="who" id="who"></div>
    <button class="btn ghost sm" onclick="logout()">Sign out</button>
  </div>
  <div class="wrap">
    <div class="bar"><div class="stat" id="stat">Loading the 24 portals…</div>
      <button class="btn ghost sm" onclick="showMatrix()">Capability matrix</button></div>
    <div id="portals"></div>
  </div>
</div>

<div class="dw-bg" id="dwbg" onclick="closeDrawer()"></div>
<div class="dw" id="dw"><button class="x" onclick="closeDrawer()">✕</button><div id="dw-body"></div></div>

<script>
const API_DEFAULT="https://gods-platform-core.onrender.com";
const base=()=>localStorage.getItem("udoc_p_api")||API_DEFAULT;
const tok=()=>localStorage.getItem("udoc_p_tok")||"";
let ME={},WS=null,CATALOG=[];
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
async function api(path,opts={}){const h=Object.assign({},opts.headers||{});if(tok())h.Authorization="Bearer "+tok();
  const r=await fetch(base()+path,Object.assign({},opts,{headers:h}));
  if(r.status===401){logout();throw new Error("Session expired");}
  const ct=r.headers.get("content-type")||"";const b=ct.includes("json")?await r.json().catch(()=>null):await r.text();
  if(!r.ok)throw new Error((b&&b.detail)||("HTTP "+r.status));return b;}

async function login(){const e=document.getElementById("li-err");e.textContent="";
  const a=document.getElementById("li-api").value.trim();if(a)localStorage.setItem("udoc_p_api",a.replace(/\/+$/,""));
  const b=document.getElementById("li-btn");b.disabled=true;b.textContent="Signing in…";
  try{const f=new URLSearchParams();f.set("username",document.getElementById("li-email").value.trim().toLowerCase());
    f.set("password",document.getElementById("li-pass").value);
    const r=await fetch(base()+"/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:f});
    if(!r.ok)throw new Error(r.status===401?"Invalid credentials":"Login failed");
    const d=await r.json();localStorage.setItem("udoc_p_tok",d.access_token);
    ME={role:d.role,division:d.division,email:document.getElementById("li-email").value.trim()};
    localStorage.setItem("udoc_p_me",JSON.stringify(ME));await enter();
  }catch(err){e.textContent=err.message;}finally{b.disabled=false;b.textContent="Sign in";}}
function logout(){["udoc_p_tok","udoc_p_me"].forEach(k=>localStorage.removeItem(k));
  document.getElementById("app").style.display="none";document.getElementById("login").style.display="block";}

async function enter(){
  document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";
  ME=JSON.parse(localStorage.getItem("udoc_p_me")||"{}");
  document.getElementById("who").innerHTML=esc(ME.email||"")+"<br>"+esc(ME.role||"")+(ME.division&&ME.division!=="GODS"?" · "+esc(ME.division):"");
  // load the active profile's live workspace (for the Operate panel)
  try{WS=await api("/workspace");}catch(e){WS=null;}
  let data;try{data=await api("/access/profiles");}catch(e){document.getElementById("stat").textContent=e.message;return;}
  CATALOG=data.profiles||[];const byg=data.by_group||{};
  const order=["GOVERNANCE","OPERATIONS","PEOPLE","BUSINESS"];
  document.getElementById("stat").textContent=CATALOG.length+" sovereign-operator portals · grouped across "+order.length+" domains";
  let html="";
  order.forEach(g=>{const list=(byg[g]||CATALOG.filter(p=>p.group===g));if(!list.length)return;
    html+='<div class="group"><h2>'+g+'</h2><div class="ln"></div><span class="ct">'+list.length+' portals</span></div><div class="grid">'+
      list.map(p=>portalCard(p)).join("")+'</div>';});
  document.getElementById("portals").innerHTML=html;
}
function portalCard(p){const idx=CATALOG.indexOf(p);
  return '<div class="pc" onclick="openPortal('+idx+')"><div class="h"><div class="nm">'+esc(p.title)+'</div>'+
    '<span class="dv '+esc(p.division)+'">'+esc(p.division)+'</span></div>'+
    '<div class="role">'+esc(p.base_role)+' · '+(p.systems||[]).length+' systems · '+(p.capabilities||[]).length+' controls</div>'+
    '<div class="caps">'+esc((p.desc||(p.capabilities||[]).join(" · ")).slice(0,96))+(((p.desc||"").length>96)?"…":"")+'</div>'+
    '<div class="enter">Enter portal ›</div></div>';}

let CURKEY=null;
async function openPortal(i){const base=CATALOG[i];if(!base)return;CURKEY=base.key;
  document.getElementById("dwbg").classList.add("on");document.getElementById("dw").classList.add("on");
  document.getElementById("dw-body").innerHTML='<div class="grp">'+esc(base.group)+'</div><h3 class="serif">'+esc(base.title)+'</h3><div class="note" style="margin-top:14px">Loading portal…</div>';
  let d;try{d=await api("/portal/"+encodeURIComponent(base.key));}catch(e){document.getElementById("dw-body").innerHTML='<div class="note">'+esc(e.message)+'</div>';return;}
  renderPortal(d);}

function renderPortal(d){const p=d.portal,may=d.may_operate;
  const ctrls=(p.controls||[]).map(c=>
    '<button class="ctrl" onclick="operate(\''+esc(c.name).replace(/'/g,"\\'")+'\')"'+(may?'':' style="opacity:.7"')+'>'+
    '<span><b>'+esc(c.name)+'</b><br><span style="font-size:11.5px;color:var(--mut)">'+esc(c.desc||"")+'</span></span>'+
    (may?'<span class="a">▶</span>':'<span class="pill warn">role-gated</span>')+'</button>').join("");
  const act=(d.activity||[]);
  const feed=act.length?act.map(a=>'<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">'+
    '<div style="min-width:0"><div style="font-size:13px;font-weight:600">'+esc(a.control)+'</div><div style="font-size:11px;color:var(--mut2)" class="mono">'+esc(a.ref)+' · '+esc((a.at||"").replace("T"," ").slice(0,16))+'</div></div>'+
    '<span class="pill ok">'+esc(a.status)+'</span></div>').join(""):'<div class="note">No operations recorded yet — run a control above.</div>';
  document.getElementById("dw-body").innerHTML=
    '<div class="grp">'+esc(p.group)+'</div><h3 class="serif">'+esc(p.title)+'</h3>'+
    '<div class="meta">'+esc(p.base_role)+' · '+esc(p.division)+' division</div>'+
    '<p style="color:var(--mut);font-size:13.5px;line-height:1.55;margin:14px 0 0">'+esc(p.desc||"")+'</p>'+
    (may?'':'<div class="note" style="margin-top:12px">You are <b>'+esc(d.operator_role)+'</b>. These controls are authorised to the <b>'+esc(p.base_role)+'</b> role and enforced server-side — sign in holding this profile to operate them live.</div>')+
    '<div class="lbl">Controls'+(may?' · live':'')+'</div>'+(ctrls||'<div class="note">No controls.</div>')+
    '<div class="lbl">Systems this portal may open</div>'+((p.systems||[]).length?p.systems.map(s=>'<span class="chip">'+esc(s)+'</span>').join(""):'<span class="note">None mapped.</span>')+
    '<div class="lbl">Recent activity</div>'+feed;}

async function operate(control){if(!CURKEY)return;
  try{const r=await api("/portal/"+encodeURIComponent(CURKEY)+"/control",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({control})});
    toast("✓ "+r.ref+" · "+control);
    const d=await api("/portal/"+encodeURIComponent(CURKEY));renderPortal(d);
  }catch(e){toast("✕ "+e.message);}}

async function showMatrix(){let m;try{m=await api("/access/matrix");}catch(e){toast(e.message);return;}
  const rs=m.role_systems||{};
  document.getElementById("dw-body").innerHTML='<div class="grp">Access</div><h3 class="serif">Capability matrix</h3>'+
    '<div class="meta">'+esc(m.count||CATALOG.length)+' profiles · '+(m.groups||[]).length+' domains</div>'+
    '<div class="lbl">Role → systems grid</div>'+Object.keys(rs).map(r=>'<div style="margin-bottom:10px"><b style="text-transform:capitalize;color:var(--gold-l)">'+esc(r)+'</b><br>'+(rs[r]||[]).map(s=>'<span class="chip">'+esc(s)+'</span>').join("")+'</div>').join("")+
    '<div class="note" style="margin-top:8px">'+esc(m.note||"")+'</div>';
  document.getElementById("dwbg").classList.add("on");document.getElementById("dw").classList.add("on");}

if(tok()&&localStorage.getItem("udoc_p_me"))enter();
</script>
</body></html>
